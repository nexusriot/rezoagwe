name: CI

# Four implementations of one protocol and nothing ran their tests. The two
# worst bugs this project has had — a Go nil slice the Kotlin decoder refused,
# and a UDP send Android silently dropped — were both drift between ports, found
# by hand, months apart. That is the class of bug a matrix of suites catches on
# the push that introduces it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l . | grep -v '^electron/' || true)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"; echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      # The race detector is the point of running these at all: every
      # convergence test drives a whole cluster of goroutines through one
      # in-memory network.
      - name: test
        run: go test -race -count=1 ./...

  cross-build:
    name: Cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The project claims five Linux architectures plus FreeBSD, macOS and
      # Windows. A claim nothing compiles is a claim that rots.
      - name: build every target
        run: make all

      - name: build the Debian packages
        run: make debs

  electron:
    name: Desktop
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - run: npm ci

      # Needs no display: the suite runs a whole cluster in one process over an
      # in-memory network, and the docs tests read the repository's Markdown.
      - name: test
        run: npm test

  android:
    name: Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: assemble
        run: ./gradlew --no-daemon :app:assembleDebug

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    # Containers, real sockets and timed events: slow enough to earn its own
    # job, and the only suite that sees what goes wrong *between* processes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: hermetic cluster
        run: make e2e
